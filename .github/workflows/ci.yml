name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Starts and exits cleanly without a key
        run: |
          set +e
          node dist/index.js < /dev/null 2> err.txt
          code=$?
          set -e
          test "$code" = "1"
          grep -q "VAARTIX_API_KEY" err.txt
